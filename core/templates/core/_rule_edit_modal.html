{# Edit-rule dialog; posts to rules_v2_save and returns to `next_url` afterwards. #}
<div class="modal fade" id="ruleV2Modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form method="post" action="{% url 'core:rules_v2_save' %}" class="modal-content">
      {% csrf_token %}
      <input type="hidden" name="id" id="ruleV2Id">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="modal-header">
        <h5 class="modal-title">Edit Rule</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="ruleV2Category">Assign to category</label>
          <select class="form-select" name="category" id="ruleV2Category" required>
            {% for g in category_groups %}
            <optgroup label="{{ g.group.name }}">
              {% for row in g.rows %}<option value="{{ row.node.pk }}">{{ row.label }}</option>{% endfor %}
            </optgroup>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="ruleV2Description">Description contains</label>
          <input type="text" class="form-control" name="description" id="ruleV2Description" maxlength="200">
        </div>
        <div class="mb-3">
          <label class="form-label" for="ruleV2AccountType">Account type</label>
          <select class="form-select" name="account_type" id="ruleV2AccountType">
            <option value="">Any</option>
            {% for value, label in account_types %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
          </select>
        </div>
        <div class="row mb-3">
          <div class="col">
            <label class="form-label" for="ruleV2Min">Min amount</label>
            <input type="number" step="0.01" class="form-control" name="amount_min" id="ruleV2Min">
          </div>
          <div class="col">
            <label class="form-label" for="ruleV2Max">Max amount</label>
            <input type="number" step="0.01" class="form-control" name="amount_max" id="ruleV2Max">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="ruleV2Metadata">Metadata (one <code>key=value</code> per line)</label>
          <textarea class="form-control" rows="2" name="metadata" id="ruleV2Metadata"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Tags</label>
          {% include 'core/_rule_tag_checks.html' %}
          <div class="form-text">Added to matching transactions; existing tags are kept.</div>
        </div>
        <div class="mb-0">
          <label class="form-label" for="ruleV2Detail">Note</label>
          <input type="text" class="form-control" name="detail" id="ruleV2Detail" maxlength="500">
          <div class="form-text">Copied to matching transactions only when their note is empty.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
